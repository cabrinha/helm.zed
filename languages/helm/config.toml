name = "Helm"
grammar = "helm"
line_comments = ["# "]
# Only suffixes that are unambiguously Helm. Bare `gotmpl` is claimed by
# the gotmpl extension (hjr265/zed-gotmpl) and ties there resolve
# arbitrarily, so `*.yaml.gotmpl`/`*.yml.gotmpl` (matched by Zed as compound
# suffixes) are the most specific Helm template names we claim. Chart
# templates that stay `*.yaml` still need `file_types` in settings.
path_suffixes = [
    "tpl",
    "yaml.gotmpl",
    "yml.gotmpl",
    "helmfile.yaml",
    "helmfile.yml",
    ".helmignore",
]
# Templates that open with an action, including helmfile and _helpers.tpl.
# Path globs such as charts/*/templates/*.yaml still need file_types in settings.
first_line_pattern = "^\\s*\\{\\{[-]?\\s*(if|range|with|define|block|template|include|/\\*)"
tab_size = 2
word_characters = ["-"]
block_comment = ["{{/* ", " */}}"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "{{", end = "}}", close = true, newline = false },
    { start = "{{-", end = "-}}", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false },
    { start = "`", end = "`", close = true, newline = false },
]
decrease_indent_patterns = [
    { pattern = "^\\s*\\{\\{-?\\s*else(\\s+if)?\\b", valid_after = ["if", "range", "with"] },
    { pattern = "^\\s*\\{\\{-?\\s*end\\b" },
]
