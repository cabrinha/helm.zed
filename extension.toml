id = "helm"
name = "Helm"
version = "0.0.7"
schema_version = 1
authors = [
    "cabrinha <yuppie@hey.com>",
    "MrJosh <hi@mrjosh.me>",
    "Hemant Joshi <mail@hjoshi.me>",
]
description = "Syntax highlighting for Helm templates"
repository = "https://github.com/cabrinha/helm.zed"

[language_servers.helm]
name = "helm_ls"
language = "Helm"

# helm-ls only treats languageId "helm" (lowercase) as a template document.
[language_servers.helm.language_ids]
Helm = "helm"

# Vendored helm dialect in this repo. Rest-of-line empty-brace tokens on
# top of ngalaiko/tree-sitter-go-template#53. `{}` stays one text node;
# typing at EOL after emptyDir: {} stays on that line so YAML for keys
# below is not prefixed with the edit. YAML is injected per (text) node,
# not combined (zed#57341).
[grammars.helm]
repository = "https://github.com/cabrinha/helm.zed"
commit = "22fd4dce6d9c48d31738aeca7a1f5b839f4fd2be"
path = "vendor/tree-sitter-helm"
