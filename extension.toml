id = "helm"
name = "Helm"
version = "0.0.7"
schema_version = 1
authors = [
    "cabrinha <yuppie@hey.com>",
    "MrJosh <hi@mrjosh.me>",
    "Hemant Joshi <mail@hjoshi.me>",
]
description = "Syntax highlighting for Helm templates"
repository = "https://github.com/cabrinha/helm.zed"

[language_servers.helm]
name = "helm_ls"
language = "Helm"

# helm-ls only treats languageId "helm" (lowercase) as a template document.
[language_servers.helm.language_ids]
Helm = "helm"

# Pinned to the empty-braces lexer fix (ngalaiko/tree-sitter-go-template#53).
# `{}` stays one text node so YAML combined injection survives incremental edits.
[grammars.helm]
repository = "https://github.com/tzabbi/tree-sitter-go-template"
commit = "ee8ba702dd0421c4e374b05175e2efbc6a0ecc0b"
path = "dialects/helm"
