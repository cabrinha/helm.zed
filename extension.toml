id = "helm"
name = "Helm"
version = "0.0.8"
schema_version = 1
authors = [
    "cabrinha <yuppie@hey.com>",
    "MrJosh <hi@mrjosh.me>",
    "Hemant Joshi <mail@hjoshi.me>",
]
description = "Syntax highlighting for Helm templates"
repository = "https://github.com/cabrinha/helm.zed"

[language_servers.helm]
name = "helm_ls"
language = "Helm"

# helm-ls only treats languageId "helm" (lowercase) as a template document.
[language_servers.helm.language_ids]
Helm = "helm"

# Vendored helm dialect in this repo. `{}` plus rest of line plus the
# trailing newline is one text token, so an EOL insert after emptyDir: {}
# stays in that node and YAML for keys below is not dropped. YAML is
# injected per (text) node, not combined (zed#57341).
[grammars.helm]
repository = "https://github.com/cabrinha/helm.zed"
commit = "d4a62d114ffc784cf7df8ec294d8323d590de46d"
path = "vendor/tree-sitter-helm"
